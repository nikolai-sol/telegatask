name: Deploy Mini App to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'mini-app/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject API base URL
        run: |
          # Insert meta tag with API base URL into index.html
          API_URL="${{ vars.MINIAPP_API_URL }}"
          if [ -n "$API_URL" ]; then
            sed -i "s|</head>|  <meta name=\"api-base\" content=\"${API_URL}\">\n</head>|" mini-app/index.html
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: mini-app

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
